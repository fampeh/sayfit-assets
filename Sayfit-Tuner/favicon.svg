<!-- The Bekuk mark, from SVG/Bekuk-Logo.svg — the same path, the same #0097A7,
     no tile behind it.

     The viewBox is the drawing's own box, not a square: with no tile there is
     no margin to keep, so the mark spans the full width and the browser
     letterboxes the rest. That is what bought the legibility back — measured by
     rasterising this file the way a browser draws it (contain, centred), the
     glyph covers **39.1%** of a 16px tab icon, against 12.1% for the version
     that sat inset on a filled tile.

     The canvas is transparent, so the tab background shows through in both
     light and dark. #0097A7 is mid-toned enough to hold on either. -->
