    <style>
      /* Painted before the bundle loads, so a dark theme has no white flash. */
      html {
        background: #0b0f16;
      }
      html[data-theme='light'] {
        background: #f4f7fb;
      }

      /* ================================================================
         The plucked string — what stands in for a loading spinner.

         All of it lives here rather than in the bundle, because a loader that
         arrives with the bundle has nothing left to cover. This paints in the
         same breath as the background colour above.
         ================================================================ */

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 9999;
        /* Starts invisible and fades IN after a beat. A cached bundle mounts in
           about a tenth of a second, and a loader seen for that long is not a
           loader, it is a flicker — this way a fast load never shows it at all
           and only a real wait is ever covered. */
        opacity: 0;
        animation: boot-in 0.32s ease 0.16s forwards;
      }

      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }

      /* React sets this the moment it has painted. */
      html[data-app-ready] #boot {
        animation: none;
        opacity: 0;
        transition: opacity 0.34s ease;
        pointer-events: none;
      }

      #boot svg {
        /* Full height, always: the string runs off both edges of the frame, so
           its two nodes — the ends, which do not move — sit outside the screen
           and every part of it that can be seen is moving. Width is capped so
           the vibration keeps a sane amplitude on a desktop monitor; the string
           itself stays dead centre either way. */
        width: min(100vw, 460px);
        height: 100%;
        display: block;
        overflow: visible;
      }

      #boot .string {
        stroke: #0097a7;
        fill: none;
        stroke-linecap: round;
        /* The stroke keeps its real thickness however the viewBox is stretched
           — without this, `preserveAspectRatio="none"` would squash a vertical
           line's width along with everything else. */
        vector-effect: non-scaling-stroke;
      }

      /* The string at rest: always drawn, full strength. The blur around it is
         what moves; this is what it is. */
      #boot .core {
        stroke-width: 1.6;
      }

      /* The vibrating copies. Each is the same bow, and `scaleX` about the
         centre line is exactly amplitude — the two ends sit on that line, so
         scaling horizontally moves the belly and leaves the ends alone.
         Physics, not a trick: a plucked string is a standing wave. */
      #boot .wave {
        stroke-width: 1.1;
        opacity: 0.55;
        transform-box: view-box;
        transform-origin: 50px 60px;
        animation: boot-swing 0.19s linear infinite;
      }

      @keyframes boot-swing {
        0% {
          transform: scaleX(1);
        }
        50% {
          transform: scaleX(-1);
        }
        100% {
          transform: scaleX(1);
        }
      }

      /* Six copies, evenly spread across one cycle, so at any instant the eye
         is shown the string in six places at once — which is the several-string
         illusion, and is what a real one looks like. Dimmer towards the middle
         of the sweep: a string moves fastest through the centre and slowest at
         the extremes, so it is *seen* least where it moves most. */
      #boot .wave:nth-of-type(1) { animation-delay: 0s; opacity: 0.5; }
      #boot .wave:nth-of-type(2) { animation-delay: -0.031s; opacity: 0.3; }
      #boot .wave:nth-of-type(3) { animation-delay: -0.063s; opacity: 0.22; }
      #boot .wave:nth-of-type(4) { animation-delay: -0.095s; opacity: 0.22; }
      #boot .wave:nth-of-type(5) { animation-delay: -0.127s; opacity: 0.3; }
      #boot .wave:nth-of-type(6) { animation-delay: -0.158s; opacity: 0.5; }

      /* The pluck itself: one decay, then silence, then again. It repeats
         because a slow connection would otherwise be left looking at a still
         line — the sound stops, the waiting does not. */
      #boot .pluck {
        transform-box: view-box;
        transform-origin: 50px 60px;
        animation: boot-decay 1.9s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
      }

      @keyframes boot-decay {
        0% {
          transform: scaleX(0.06);
        }
        6% {
          transform: scaleX(1);
        }
        70% {
          transform: scaleX(0.08);
        }
        100% {
          transform: scaleX(0.02);
        }
      }

      /* Movement off: the string simply is. Still the brand colour, still the
         thing on the screen, just not vibrating. */
      @media (prefers-reduced-motion: reduce) {
        #boot .wave {
          display: none;
        }
        #boot .pluck {
          animation: none;
        }
        #boot {
          animation-duration: 0.01ms;
        }
      }
    </style>
    <script>
      // Resolve the stored theme before first paint.
      try {
        var stored = JSON.parse(localStorage.getItem('bekuk.theme'));
        document.documentElement.dataset.theme =
          stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>

  <body>
    <!--
      Empty on purpose.

      A block of Persian copy used to be rendered here so that a crawler had
      something to read before the bundle arrived (§13.24). It has been removed:
      it was visible for a beat on every single load, and an app whose entire
      promise is "open it and tune" should not open on a paragraph about itself.

      The link previews that actually matter — Telegram, WhatsApp, Twitter — read
      the og: tags in <head>, not the body, so those are untouched. What this
      does give up is the text Google sees before it runs the JavaScript. The
      planned answer to that was never this block anyway: it is the static
      landing pages in §16.7 بند ۶, which can carry real copy without any of it
      appearing in front of someone who came here to tune a سه‌تار.
    -->
    <!--
      The loading state: one string, plucked.

      Markup rather than an image because it has to animate, and inline rather
      than a file because it has to be on screen before anything is fetched.

      `preserveAspectRatio="none"` so the viewBox stretches to the window: the
      string's ends are at y=-40 and y=140 in a 0–120 box, which puts both nodes
      well outside the frame in every window shape. That is deliberate — the
      ends of a plucked string are the only parts that do not move, and keeping
      them off screen means everything visible is in motion.

      `aria-hidden` and no text: there is nothing here to read out, and a screen
      reader announcing a decoration is worse than silence.
    -->
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 100 120" preserveAspectRatio="none" focusable="false">
        <g class="pluck">
          <!-- Six phases of one oscillation. Same bow every time; only the
               horizontal scale differs, which is the amplitude. -->
          <path class="string wave" d="M50 -40 C 34 20, 34 100, 50 140" />
          <path class="string wave" d="M50 -40 C 34 20, 34 100, 50 140" />
          <path class="string wave" d="M50 -40 C 34 20, 34 100, 50 140" />
          <path class="string wave" d="M50 -40 C 34 20, 34 100, 50 140" />
          <path class="string wave" d="M50 -40 C 34 20, 34 100, 50 140" />
          <path class="string wave" d="M50 -40 C 34 20, 34 100, 50 140" />
        </g>
        <!-- The string itself, at rest, outside the vibrating group: it is the
             one line that never moves, and what the blur is a blur *of*. -->
        <path class="string core" d="M50 -40 L50 140" />
      </svg>
    </div>

    <div id="root"></div>
  </body>
